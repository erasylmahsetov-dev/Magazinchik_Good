<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--orange:#ff8a00;--bg:#f7f8fb;--card:#fff;--text:#181818;--muted:#777;--danger:#d93025}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
body{padding-bottom:82px;
background:
radial-gradient(circle at 10% 5%, rgba(255,138,0,.13), transparent 28%),
radial-gradient(circle at 90% 18%, rgba(255,190,80,.12), transparent 25%),
linear-gradient(180deg,#fffaf3 0%,#f7f8fb 42%,#f5f7fb 100%)}
.app{max-width:560px;margin:auto;padding:14px 14px 24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{font-size:22px;font-weight:800}.top-profile{border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:21px}
.search{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;font-size:17px;outline:none;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:22px;padding:11px 17px;background:#fff;white-space:nowrap;font-size:15px}.tab.active{background:var(--orange);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.product{background:#fff;border-radius:20px;padding:10px;overflow:hidden}.photo{height:155px;border-radius:16px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:58px}
.name{font-weight:800;font-size:18px;margin:10px 3px 5px}.price{font-weight:800;color:var(--orange);font-size:18px}.desc{color:var(--muted);font-size:13px;min-height:30px;margin:5px 3px}
.add{width:100%;border:0;border-radius:13px;background:var(--orange);color:#fff;padding:12px 8px;font-size:15px;font-weight:800;margin-top:8px}
.empty-shop{text-align:center;padding:55px 20px;color:var(--muted);background:#fff;border-radius:20px;margin-top:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e8e8e8;z-index:1000}.bottom-inner{max-width:560px;margin:auto;display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.nav{flex:1;border:0;background:transparent;color:#666;font-size:12px;padding:4px}.nav b{display:block;font-size:22px;margin-bottom:2px}.nav.active{color:var(--orange)}
.panel{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;overflow:auto}.panel.show{display:block}.panel-inner{max-width:560px;margin:auto;padding:15px 14px 120px}
.back{border:0;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}.card h3{margin:0 0 12px}
.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:16px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange)}
.error{color:var(--danger);font-size:13px;font-weight:700;margin-top:5px;display:none}.field.invalid input,.field.invalid select{border-color:var(--danger)}.field.invalid .error{display:block}
.primary{width:100%;border:0;border-radius:13px;background:var(--orange);color:#fff;padding:14px;font-size:16px;font-weight:800}
.secondary{width:100%;border:1px solid #ddd;border-radius:13px;background:#fff;padding:13px;font-size:15px;font-weight:700;margin-top:8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.cart-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.cart-emoji{width:58px;height:58px;border-radius:13px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:30px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:0;border-radius:9px;background:#eee;font-size:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 16px;border-radius:13px;opacity:0;pointer-events:none;transition:.25s;z-index:500;font-size:14px;text-align:center;max-width:90%}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.installments{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.limit{border:1px solid #ddd;border-radius:12px;padding:11px;text-align:center;background:#fff}.limit.active{border:2px solid var(--orange)}
.badge{display:inline-block;padding:5px 9px;border-radius:10px;background:#fff1df;color:#b85f00;font-size:12px;font-weight:700}
.order-ok{text-align:center;padding:30px 15px}.order-ok .big{font-size:52px}
@media(max-width:390px){.grid{grid-template-columns:1fr}.photo{height:190px}}
body{
background:
radial-gradient(circle at 8% 8%,rgba(255,138,0,.13),transparent 27%),
radial-gradient(circle at 92% 25%,rgba(255,190,80,.12),transparent 25%),
linear-gradient(180deg,#fffaf3 0%,#f7f8fb 45%,#f4f6fb 100%);
}
.hero{margin:0 0 12px!important;background:linear-gradient(135deg,#fff3df,#ffffff)!important}
.hero-title{font-size:20px;font-weight:800}.hero-sub{color:#777;margin-top:5px}
.quick-installment{margin:18px 16px 94px;padding:15px 17px;border-radius:20px;background:linear-gradient(135deg,#fff1d7,#fff);display:flex;align-items:center;gap:12px;box-shadow:0 8px 25px rgba(0,0,0,.07);cursor:pointer}
.quick-installment>span{font-size:28px}.quick-installment div{flex:1}.quick-installment b{display:block;font-size:17px}.quick-installment small{color:#888}.quick-installment strong{font-size:28px;color:#ff9800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}.modal-card{background:#fff;border-radius:20px;padding:20px;width:min(420px,100%)}.modal-card button{display:block;margin-top:10px}</style>
</head>
<body>
<div class="app" id="homePage">
<header><div><div id="greeting" style="font-size:16px;font-weight:700;margin-bottom:3px">Здравствуйте!</div><div class="logo">🛍️ <span>Мой магазин</span></div></div><button class="top-profile" onclick="openPanel('profile')">👤</button></header>
<div class="hero card"><div class="hero-title">✨ Выгодные покупки каждый день</div><div class="hero-sub">Новинки, скидки и товары для вас</div></div><input id="search" class="search" placeholder="Поиск товаров..." oninput="renderProducts()">
<div class="tabs" id="tabs"></div>
<div id="products" class="grid"></div>
</div>

<div class="panel" id="cartPanel">
<div class="panel-inner">
<button class="back" onclick="closePanels()">← Назад</button>
<h2>🛒 Корзина</h2>
<div id="cartContent"></div>
</div></div>

<div class="panel" id="profilePanel">
<div class="panel-inner">
<button class="back" onclick="closePanels()">← Назад</button>
<h2>👤 Профиль</h2>
<div id="profileContent"></div>
</div></div>

<div class="bottom"><div class="bottom-inner">
<button class="nav" id="navHome" onclick="goHome()"><b>🏠</b><span data-i18n="home">Домой</span></button>
<button class="nav" id="navCart" onclick="openPanel('cart')"><b>🛒</b><span data-i18n="cart">Корзина</span></button>
<button class="nav" id="navNasiya" onclick="openNasiya()"><b>💳</b><span data-i18n="nasiya">Насия</span></button>
<button class="nav" id="navProfile" onclick="openPanel('profile')"><b>👤</b><span data-i18n="profile">Профиль</span></button>
</div></div>
<div id="toast" class="toast"></div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
let products=[];
const API_BASE = '';
async function loadProducts(){ try{ const r=await fetch(API_BASE+'/api/products'); if(r.ok) products=await r.json(); }catch(e){ products=[]; } renderProducts(); } 
let cart=JSON.parse(localStorage.getItem('shop_cart')||'{}');
let profile=JSON.parse(localStorage.getItem('shop_profile')||'null');
let lang=localStorage.getItem('shop_lang')||'ru';
let customerId=localStorage.getItem('customer_id');
if(!customerId){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  customerId='USR-'+Array.from({length:8},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  localStorage.setItem('customer_id',customerId);
}
let selectedLimit=profile?.limit||10000;

const cats=[['all','Все'],['new','Новинки'],['discount','Скидки']];
let activeCat='all';

function money(n){return Number(n).toLocaleString('ru-RU')+' сум'}
function updateGreeting(){
  const u=tg?.initDataUnsafe?.user||{};
  const saved=profile||{};
  const name=saved.name||u.first_name||'';
  const el=document.getElementById('greeting');
  if(el) el.textContent=name?'Здравствуйте, '+name+'!':'Здравствуйте!';
}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),1800)}
function goHome(){closePanels();document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById('navHome').classList.add('active');scrollTo(0,0)}

function setActiveNav(id){
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById(id);
  if(el)el.classList.add('active');
}
function hideAllPanels(){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));
}
function goHome(){
  hideAllPanels();
  setActiveNav('navHome');
  window.scrollTo(0,0);
}
function openPanel(which){
  hideAllPanels();
  const p=document.getElementById(which+'Panel');
  if(!p)return;
  p.classList.add('show');
  setActiveNav(which==='cart'?'navCart':'navProfile');
  if(which==='cart')renderCart();
  if(which==='profile')renderProfile();
}
function openNasiya(){
  hideAllPanels();
  const p=document.getElementById('nasiyaPanel');
  if(!p)return;
  p.classList.add('show');
  setActiveNav('navNasiya');
  renderNasiya();
}
function closePanels(){goHome();}

function renderNasiya(){
  const el=document.getElementById('nasiyaContent');
  if(!el)return;
  el.innerHTML=`
    <div class="card">
      <h2>💳 Насия</h2>
      <p style="color:#777">Рассрочка для покупок</p>
      <h3>Доступный лимит</h3>
      <div class="installments">
        ${[10000,20000,100000].map(n=>`
          <button class="limit ${selectedLimit===n?'active':''}" onclick="selectedLimit=${n};profile={...(profile||{}),limit:selectedLimit};localStorage.setItem('shop_profile',JSON.stringify(profile));renderNasiya()">
            ${money(n)}
          </button>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3>Как работает Насия</h3>
      <p style="color:#777">Выберите лимит и оформляйте покупки в рассрочку.</p>
      <span class="badge">Насия</span>
    </div>`;
}

function renderTabs(){document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="tab ${activeCat===c[0]?'active':''}" onclick="activeCat='${c[0]}';renderTabs();renderProducts()">${c[1]}</button>`).join('')}
function renderProducts(){
  renderTabs();
  const q=document.getElementById('search').value.trim().toLowerCase();
  let list=products.filter(p=>(activeCat==='all'||(activeCat==='new'&&p.new)||(activeCat==='discount'&&p.discount)||(p.cat===activeCat)) && p.name.toLowerCase().includes(q));
  const box=document.getElementById('products');
  if(!list.length){box.className='';box.innerHTML=`<div class="empty-shop"><div style="font-size:45px">🛍️</div><h3>Товары скоро появятся</h3><p></p></div>`;return}
  box.className='grid';
  box.innerHTML=list.map(p=>`<article class="product"><div class="photo">${p.emoji||'🛍️'}</div><div class="name">${p.name}</div><div class="price">${money(p.price)}</div><div class="desc">${p.desc||''}</div><button class="add" onclick="addToCart(${p.id})">Добавить в корзину</button></article>`).join('');
}
function addToCart(id){
  cart[id]=(cart[id]||0)+1;localStorage.setItem('shop_cart',JSON.stringify(cart));
  toast('Этот товар переместился в вашу корзину');
}
function cartItems(){
  return Object.entries(cart).map(([id,qty])=>({p:products.find(x=>x.id==id),qty:Number(qty)})).filter(x=>x.p);
}
function renderCart(){
  const box=document.getElementById('cartContent'), items=cartItems();
  if(!items.length){box.innerHTML=`<div class="card" style="text-align:center;padding:45px 15px"><div style="font-size:48px">🛒</div><h3>Корзина пуста</h3><p style="color:#777">Добавьте товары из каталога.</p></div>`;return}
  let total=0;
  box.innerHTML=items.map(({p,qty})=>{let sum=p.price*qty;total+=sum;return `<div class="card cart-item"><div class="cart-emoji">${p.emoji||'🛍️'}</div><div style="flex:1"><b>${p.name}</b><div style="color:#ff8a00;font-weight:800">${money(p.price)}</div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button><b>${qty}</b><button onclick="changeQty(${p.id},1)">+</button></div></div><b>${money(sum)}</b></div>`}).join('')+
  `<div class="card"><div class="row"><b>Итого</b><b>${money(total)}</b></div><button class="primary" onclick="startCheckout()">Оформить заказ</button></div>`;
}
function changeQty(id,d){
  cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];
  localStorage.setItem('shop_cart',JSON.stringify(cart));renderCart();
}
function renderProfile(){
  const u=tg?.initDataUnsafe?.user||{};
  const saved=profile||{};
  document.getElementById('profileContent').innerHTML=`
    <div class="card">
      <h3>📦 Ваши заказы</h3>
      <div id="ordersBox"></div>
    </div>
    <button class="card" style="width:100%;border:0;text-align:left;cursor:pointer" onclick="openDataPage()">
      <h3 style="margin-bottom:5px">👤 Ваши данные</h3>
      <p style="color:#777;margin:0">Посмотреть ID, имя, пол и другую информацию →</p>
    </button>
    <div class="card" onclick="changeLanguage()" style="cursor:pointer">
      <h3>🌐 Язык</h3>
      <p style="margin:0;color:#777">Текущий язык: <b>${langName()}</b></p>
      <button class="secondary" onclick="event.stopPropagation();changeLanguage()">Изменить язык</button>
    </div>`;
  renderOrders();
}
function openDataPage(){
  hideAllPanels();
  const p=document.getElementById('dataPanel');
  if(p)p.classList.add('show');
  setActiveNav('navProfile');
  renderDataPage();
}
function renderDataPage(){
  const u=tg?.initDataUnsafe?.user||{};
  const saved=profile||{};
  const box=document.getElementById('dataContent');
  if(!box)return;
  box.innerHTML=`
    <div class="card">
      <div class="row"><span>ID</span><b>${customerId}</b></div>
      <div class="field" id="fName">
        <label>Ваше имя *</label>
        <input id="pName" value="${esc(saved.name||u.first_name||'')}" placeholder="Введите имя">
        <div class="error">Извините, это поле обязательно.</div>
      </div>
      <div class="field">
        <label>Пол</label>
        <select id="pGender">
          <option value="">Не указывать</option>
          <option ${saved.gender==='Женский'?'selected':''}>Женский</option>
          <option ${saved.gender==='Мужской'?'selected':''}>Мужской</option>
        </select>
      </div>
      <div class="field">
        <label>О себе</label>
        <textarea id="pNote" rows="3" placeholder="Можно что-нибудь написать">${esc(saved.note||'')}</textarea>
      </div>
      <button class="primary" onclick="saveProfile();renderDataPage();updateGreeting()">Сохранить данные</button>
    </div>`;
}
function renderOrders(){
  const box=document.getElementById('ordersBox');if(!box)return;
  const orders=JSON.parse(localStorage.getItem('shop_orders')||'[]');
  box.innerHTML=orders.length?orders.map(o=>`<div class="row"><span><b>${o.id}</b><br><small>${o.deliveryDate?'Доставка: '+o.deliveryDate:'Дата доставки уточняется'}</small></span><b>${money(o.total)}</b></div>`).join(''):'<p style="color:#777">Заказов пока нет.</p>';
}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

const translations={
  ru:{home:'Домой',cart:'Корзина',nasiya:'Насия',profile:'Профиль'},
  kaa:{home:'Úy',cart:'Sebet',nasiya:'Nasiya',profile:'Profil'},
  uz:{home:'Bosh sahifa',cart:'Savat',nasiya:'Nasiya',profile:'Profil'}
};
function langName(){
  return lang==='kaa'?'Qaraqalpaqsha (KAA)':lang==='uz'?'O‘zbekcha (UZ)':'Русский (RU)';
}
function applyLang(){
  const t=translations[lang]||translations.ru;
  document.querySelectorAll('[data-i18n]').forEach(el=>{if(t[el.dataset.i18n])el.textContent=t[el.dataset.i18n]});
  updateGreeting();
}
function setLanguage(value){
  lang=value;
  localStorage.setItem('shop_lang',lang);
  const m=document.getElementById('languageModal');
  if(m)m.style.display='none';
  applyLang();
  renderProfile();
}
function changeLanguage(){
  const current=['ru','kaa','uz'].indexOf(lang);
  const next=['ru','kaa','uz'][(current+1)%3];
  setLanguage(next);
}
function saveProfile(){
  const name=document.getElementById('pName').value.trim();
  let ok=true;
  const nameField=document.getElementById('fName'); nameField.classList.toggle('invalid',!name); if(!name)return;
  profile={name,gender:document.getElementById('pGender').value,note:document.getElementById('pNote').value,limit:selectedLimit};
  localStorage.setItem('shop_profile',JSON.stringify(profile));
  fetch(API_BASE+'/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegramId:tg?.initDataUnsafe?.user?.id||null,customerId,name:profile.name,gender:profile.gender,note:profile.note,limit:profile.limit})}).catch(()=>{});
  toast('Профиль сохранён');
}
function startCheckout(){
  if(!profile?.name){
    renderProfile();
    closePanels();
    document.getElementById('profilePanel').classList.add('show');
    document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
    document.getElementById('navProfile').classList.add('active');
    toast('Извините, пожалуйста, авторизуйтесь');
    return;
  }
  const items=cartItems();if(!items.length)return;
  const total=items.reduce((a,x)=>a+x.p.price*x.qty,0);
  const delivery=new Date();delivery.setDate(delivery.getDate()+1);
  const deliveryDate=delivery.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
  const order={id:'ORD-'+Date.now(),items:items.map(x=>({id:x.p.id,name:x.p.name,qty:x.qty,price:x.p.price})),total,deliveryDate,createdAt:new Date().toISOString(),customerId,name:profile.name};
  const orders=JSON.parse(localStorage.getItem('shop_orders')||'[]');orders.unshift(order);localStorage.setItem('shop_orders',JSON.stringify(orders));
  localStorage.setItem('last_order',JSON.stringify(order));cart={};localStorage.setItem('shop_cart','{}');
  fetch(API_BASE+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)}).catch(()=>{});
  showOrderSuccess(order);
  if(tg?.sendData){try{tg.sendData(JSON.stringify({type:'order',order}))}catch(e){}}
}
function showOrderSuccess(order){
  document.getElementById('cartContent').innerHTML=`<div class="card order-ok"><div class="big">✅</div><h2>Ваш заказ оформлен!</h2><p>Номер заказа: <b>${order.id}</b></p><p>Спасибо за заказ! Мы сообщим информацию о доставке.</p><div class="card"><b>Дата доставки</b><br><span style="font-size:22px;color:#ff8a00;font-weight:800">${order.deliveryDate}</span></div><button class="primary" onclick="renderCart()">Вернуться в корзину</button></div>`;
}
applyLang();updateGreeting();renderProducts();loadProducts();
</script>
<section id="dataPanel" class="panel">
  <div class="panel-inner">
    <button class="back" onclick="openPanel('profile')">← Назад</button>
    <h2>👤 Ваши данные</h2>
    <div id="dataContent"></div>
  </div>
</section>
<section id="nasiyaPanel" class="panel">
  <div class="panel-inner">
    <button class="back" onclick="goHome()">← Назад</button>
    <div id="nasiyaContent"></div>
  </div>
</section>

<div id="languageModal" class="modal" style="display:none">
  <div class="modal-card">
    <h3>Выберите язык</h3>
    <button class="primary" onclick="setLanguage('ru')">Русский (RU)</button>
    <button class="secondary" onclick="setLanguage('kaa')">Qaraqalpaqsha (KAA)</button>
    <button class="secondary" onclick="setLanguage('uz')">O‘zbekcha (UZ)</button>
  </div>
</div>

</body>
</html>
