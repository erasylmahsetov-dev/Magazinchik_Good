<style>
:root{--o:#ff8a00;--o2:#fff0dc;--bg:#f6f7fb;--card:#fff;--t:#171717;--m:#777;--red:#d93025;--green:#198754;--line:#e9e9e9}
*{box-sizing:border-box}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s ease,background .12s ease,color .12s ease,box-shadow .12s ease}button:active{transform:scale(.96);background:#171717!important;color:#fff!important;box-shadow:0 2px 7px #0003!important}button:disabled{opacity:.5;cursor:not-allowed}html,body{margin:0;background:linear-gradient(180deg,#fffaf3 0,#f6f7fb 35%,#f4f6fb 100%);color:var(--t);font-family:Arial,sans-serif}body{padding-bottom:82px}.app{max-width:620px;margin:auto;padding:14px 14px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.logo{font-size:21px;font-weight:900}.hello{font-size:14px;font-weight:700;margin-bottom:3px}.topbtn{border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:21px;box-shadow:0 5px 16px #00000010}
.hero{background:linear-gradient(135deg,#fff0d8,#fff);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 8px 24px #0000000b}.hero-title{font-weight:900;font-size:21px}.hero-sub{color:var(--m);margin-top:6px}.search{width:100%;border:0;border-radius:16px;padding:15px 16px;font-size:16px;background:#fff;outline:none;box-shadow:0 4px 18px #00000008}.chips{display:flex;gap:8px;overflow:auto;padding:10px 1px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:0;background:#fff;border-radius:22px;padding:10px 15px;white-space:nowrap}.chip.active{background:var(--o);color:#fff;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:#fff;border-radius:20px;padding:9px;overflow:hidden;box-shadow:0 6px 22px #00000008}.pic{height:165px;border-radius:16px;background:#f0f1f4;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:52px}.name{font-size:17px;font-weight:800;margin:10px 4px 5px}.price{color:var(--o);font-weight:900;font-size:18px;margin:0 4px}.old{font-size:12px;color:#999;text-decoration:line-through;margin-left:7px}.desc{font-size:12px;color:var(--m);margin:6px 4px;min-height:30px}.pactions{display:flex;gap:7px}.add{flex:1;border:0;background:var(--o);color:#fff;border-radius:12px;padding:11px 7px;font-weight:800}.fav{width:44px;border:1px solid #eee;background:#fff;border-radius:12px;font-size:19px}.empty{background:#fff;border-radius:20px;padding:50px 20px;text-align:center;color:var(--m);grid-column:1/-1}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:100}.bottom-in{max-width:620px;margin:auto;display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.nav{flex:1;border:0;background:transparent;color:#666;font-size:12px;padding:7px 5px;border-radius:16px;margin:0 2px}.nav b{display:block;font-size:21px;line-height:22px;margin-bottom:3px}.nav.active{background:#fff0dc;color:#b85f00;font-weight:800}.nav:active{border-radius:16px;background:#171717!important;color:#fff!important}.badge{display:inline-block;background:var(--o2);color:#b55c00;border-radius:10px;padding:4px 7px;font-size:11px;font-weight:800}
.panel{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto}.panel.show{display:block}.inner{max-width:620px;margin:auto;padding:14px 14px 120px}.back{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-size:15px}.section{background:#fff;border-radius:18px;padding:15px;margin:12px 0}.section h2,.section h3{margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800}.primary{background:var(--o);color:#fff}.secondary{background:#fff;border:1px solid #ddd}.danger{background:#ffe8e8;color:#bd2720}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:16px;outline:none}.field.invalid input,.field.invalid select{border-color:var(--red)}.error{color:var(--red);font-size:12px;font-weight:700;display:none}.field.invalid .error{display:block}.cartline{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.thumb{width:62px;height:62px;border-radius:13px;overflow:hidden;background:#eee}.thumb img{width:100%;height:100%;object-fit:cover}.qty{display:flex;align-items:center;gap:8px}.qty button{width:29px;height:29px;border:0;border-radius:8px;background:#eee}.total{font-size:20px;font-weight:900;color:var(--o)}.detail-photos{display:flex;gap:8px;overflow:auto}.detail-photos img{width:180px;height:180px;object-fit:cover;border-radius:18px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec{background:#fafafa;border-radius:12px;padding:10px}.muted{color:var(--m)}.ok{text-align:center;padding:30px}.ok .big{font-size:58px}.limits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:300px;overflow:auto;padding:2px}
.limit{border:0;border-radius:14px;padding:10px 6px;background:#fff;font-weight:800;box-shadow:0 2px 8px #00000010}
.limit.sel{background:#171717;color:#fff}
.nasiya-help{font-weight:700;margin:8px 0 12px}.limit{padding:13px;border-radius:14px;background:#fff;border:1px solid #ddd;text-align:center}.limit.sel{border:2px solid var(--o)}.modal{display:none;position:fixed;inset:0;z-index:1000;background:#0005;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-card{width:min(460px,100%);background:#fff;border-radius:20px;padding:18px}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;background:#222;color:#fff;padding:12px 16px;border-radius:13px;z-index:1200;transition:.2s;max-width:92%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){.grid{grid-template-columns:1fr}.pic{height:205px}.limits{grid-template-columns:1fr}}

.adminbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.adminnav{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.adminnav button{border:0;background:#fff;border-radius:12px;padding:9px 11px;white-space:nowrap;font-weight:800}.adminnav button.active{background:var(--o);color:#fff}.admincard{background:#fff;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 5px 18px #00000008}.adm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.adm-tile{background:#fff;border-radius:16px;padding:15px}.adm-tile b{display:block;font-size:24px;margin:4px 0}.adm-thumb{width:72px;height:72px;border-radius:12px;background:#eee;overflow:hidden;flex:none}.adm-thumb img{width:100%;height:100%;object-fit:cover}.adm-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.adm-row:last-child{border-bottom:0}.adm-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.adm-photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.adm-photos img{width:70px;height:70px;object-fit:cover;border-radius:11px}.admin-close{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.admin-small{font-size:12px;color:var(--m)}
@media(max-width:430px){.adm-grid{grid-template-columns:1fr}}
</style>
<style>
/* V8_NAV_FIX: reliable navigation buttons */
.bottomnav button, .top-profile-btn {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  cursor: pointer;
  pointer-events: auto;
}
.bottomnav button:active, .top-profile-btn:active {
  transform: scale(.97);
  background:#171717 !important;
  color:#fff !important;
}
</style>
<script>
/* V8_NAV_FIX */
document.addEventListener('DOMContentLoaded', function(){
  document.addEventListener('click', function(e){
    const b = e.target.closest('.bottomnav button');
    if (!b) return;
    const t = (b.innerText || '').trim();
    try {
      if (t.includes('Домой')) { e.preventDefault(); e.stopPropagation(); if(typeof goHome==='function') goHome(); }
      else if (t.includes('Корз')) { e.preventDefault(); e.stopPropagation(); if(typeof openCart==='function') openCart(); }
      else if (t.includes('Насия') || t.includes('Нас')) { e.preventDefault(); e.stopPropagation(); if(typeof openNasiya==='function') openNasiya(); }
      else if (t.includes('Проф')) { e.preventDefault(); e.stopPropagation(); if(typeof openProfile==='function') openProfile(); }
    } catch(err) { console.error('Navigation error:', err); }
  }, true);

  document.addEventListener('click', function(e){
    const b = e.target.closest('.top-profile-btn');
    if (!b) return;
    try { e.preventDefault(); e.stopPropagation(); if(typeof openProfile==='function') openProfile(); } catch(err) { console.error(err); }
  }, true);
});
</script>

</head>
<body>
<div class="app" id="home"><header><div><div class="hello" id="hello">Здравствуйте!</div><div class="logo">✨ Magazinchik Good</div></div><button class="topbtn" type="button" class="top-profile-btn">🌟</button></header>
<div class="hero"><div class="hero-title">✨ Выгодные покупки каждый день</div><div class="hero-sub">Новинки, скидки и товары для вас</div></div>
<input id="search" class="search" placeholder="Поиск товаров..." oninput="renderProducts()"><div id="chips" class="chips"></div><div id="products" class="grid"></div></div>

<div id="adminView" class="panel" style="z-index:1500;background:#f5f6f8">
  <div class="inner" id="adminContent"></div>
</div>
<div id="panel" class="panel"><div class="inner" id="panelContent"></div></div>
<div class="bottom"><div class="bottom-in"><button type="button" class="nav active" id="n-home" onclick="goHome()"><b>✨</b>Домой</button><button type="button" class="nav" id="n-cart" onclick="openCart()"><b>🧺</b>Корзина</button><button type="button" class="nav" id="n-nasiya" onclick="openNasiya()"><b>🪙</b>Насия</button><button type="button" class="nav" id="n-profile" onclick="openProfile()"><b>🌟</b>Профиль</button></div></div>
<div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modal-card" id="modalCard"></div></div>
<script>
const cfg=window.SHOP_CONFIG||{}; const tg=window.Telegram?.WebApp; if(tg){try{tg.ready();tg.expand()}catch(e){}}
const hasSupabase=!!(window.supabase&&cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&cfg.SUPABASE_ANON_KEY!=='PASTE_YOUR_SUPABASE_ANON_KEY_HERE');
const supabase=hasSupabase?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
const safeParse=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??d}catch(e){return d}};
let products=[],categories=[],cart=safeParse('mg_cart',{}),profile=safeParse('mg_profile',null),fav=new Set(safeParse('mg_fav',[])),lang=localStorage.getItem('mg_lang')||'ru',activeCat='all',currentProduct=null;
let customerId=localStorage.getItem('mg_customer_id'); if(!customerId){customerId='USR-'+Math.random().toString(36).slice(2,10).toUpperCase();localStorage.setItem('mg_customer_id',customerId)}
const I18N={ru:{home:'Домой',cart:'Корзина',profile:'Профиль',name:'Имя',gender:'Пол',about:'О себе',save:'Сохранить',orders:'Ваши заказы',data:'Ваши данные',lang:'Язык',male:'Мужской',female:'Женский',other:'Другое',empty:'Товары скоро появятся',checkout:'Оформить заказ'},kaa:{home:'Bas bet',cart:'Sebet',profile:'Profil',name:'Atı',gender:'Jınıs',about:'Özi haqqında',save:'Saqlaw',orders:'Buyırtpalar',data:'Maǵlıwmatlarıńız',lang:'Til',male:'Er',female:'Hayal',other:'Basqa',empty:'Tawarlár tez arada payda boladı',checkout:'Buyırtpa beriw'},uz:{home:'Bosh sahifa',cart:'Savat',profile:'Profil',name:'Ism',gender:'Jins',about:'O‘zingiz haqida',save:'Saqlash',orders:'Buyurtmalaringiz',data:'Maʼlumotlaringiz',lang:'Til',male:'Erkak',female:'Ayol',other:'Boshqa',empty:'Mahsulotlar tez orada paydo bo‘ladi',checkout:'Buyurtma berish'}};
const tr=k=>I18N[lang]?.[k]||I18N.ru[k]||k; const money=n=>Number(n||0).toLocaleString('ru-RU')+' сум'; const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove('show'),1900)}
function setNav(id){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById(id)?.classList.add('active')}
function hidePanel(){document.getElementById('panel').classList.remove('show')}
function goHome(){hidePanel();setNav('n-home');scrollTo(0,0)}
function panel(html){document.getElementById('panelContent').innerHTML=html;document.getElementById('panel').classList.add('show')}
function userName(){return profile?.name||tg?.initDataUnsafe?.user?.first_name||''}
function updateHello(){document.getElementById('hello').textContent=userName()?`Здравствуйте, ${userName()}!`:'Здравствуйте!'}
function saveLocal(){localStorage.setItem('mg_cart',JSON.stringify(cart));localStorage.setItem('mg_profile',JSON.stringify(profile));localStorage.setItem('mg_fav',JSON.stringify([...fav]))}
async function load(){if(supabase){try{const [p,c]=await Promise.all([supabase.from('products').select('*,category:categories(name),images:product_images(id,public_url,storage_path,sort_order,is_main)').eq('is_active',true).order('created_at',{ascending:false}),supabase.from('categories').select('*').eq('is_active',true).order('sort_order')]);if(!p.error)products=p.data||[];if(!c.error)categories=c.data||[]}catch(e){toast('Не удалось загрузить данные. Магазин продолжает работать.')}}renderChips();renderProducts();updateHello()}
function renderChips(){const arr=[{id:'all',name:lang==='uz'?'Barchasi':lang==='kaa'?'Bári':'Все'},...categories];document.getElementById('chips').innerHTML=arr.map(c=>`<button class="chip ${activeCat===c.id?'active':''}" onclick="activeCat='${c.id}';renderChips();renderProducts()">${esc(c.name)}</button>`).join('')}
function mainImage(p){const im=(p.images||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0];return im?.public_url||''}
function renderProducts(){const q=(document.getElementById('search')?.value||'').trim().toLowerCase();let arr=products.filter(p=>(activeCat==='all'||p.category_id===activeCat||p.category?.id===activeCat)&&(!q||String(p.name||'').toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q)));const box=document.getElementById('products');if(!arr.length){box.innerHTML=`<div class="empty">${tr('empty')}</div>`;return}box.innerHTML=arr.map(p=>`<div class="product"><div class="pic" onclick="openProduct('${p.id}')">${mainImage(p)?`<img src="${mainImage(p)}">`:'<div class="placeholder">📦</div>'}</div><div class="name" onclick="openProduct('${p.id}')">${esc(p.name)}</div><div class="price">${money(p.price)}${p.old_price?`<span class="old">${money(p.old_price)}</span>`:''}</div><div class="desc">${esc((p.description||'').slice(0,60))}</div><div class="pactions"><button class="fav" onclick="toggleFav('${p.id}')">${fav.has(p.id)?'❤️':'🤍'}</button><button class="add" onclick="addToCart('${p.id}')">🛒 Добавить</button></div></div>`).join('')}
async function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;currentProduct=p;setNav('n-home');const imgs=(p.images||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));panel(`<button class="back" onclick="hidePanel()">← Назад</button><div class="section"><h2>${esc(p.name)}</h2><div class="detail-photos">${imgs.length?imgs.map(i=>`<img src="${i.public_url||''}">`).join(''):'<div class="pic" style="width:180px">📦</div>'}</div><p class="price" style="font-size:24px">${money(p.price)}</p><p>${esc(p.description||'Описание пока не добавлено.')}</p><div class="row"><span>Наличие</span><b>${p.stock_qty>0?'В наличии':'Нет в наличии'}</b></div><div class="row"><span>Остаток</span><b>${p.stock_qty}</b></div><div class="row"><span>👁️ Просмотры</span><b>${p.views||0}</b></div><div class="row"><span>🛒 Добавления</span><b>${p.cart_adds||0}</b></div><div class="row"><span>🛍️ Покупки</span><b>${p.purchases||0}</b></div><h3>Характеристики</h3><div class="specs">${Object.entries(p.specs||{}).map(([k,v])=>`<div class="spec"><b>${esc(k)}</b><div>${esc(v)}</div></div>`).join('')||'<div class="muted">Нет характеристик</div>'}</div><button class="btn primary" style="width:100%;margin-top:12px" ${p.stock_qty>0?'':'disabled'} onclick="addToCart('${p.id}');toast('Этот товар переместился в вашу корзину')">🛒 Добавить в корзину</button></div>`);if(supabase){try{await supabase.rpc('add_product_view',{p_product_id:p.id,p_user_id:null,p_telegram_id:tg?.initDataUnsafe?.user?.id||null})}catch(e){}}}
async function addToCart(id){const p=products.find(x=>x.id===id);if(!p||p.stock_qty<=0)return toast('Товара нет в наличии');cart[id]=(cart[id]||0)+1;saveLocal();toast('Этот товар переместился в вашу корзину');if(supabase){try{await supabase.rpc('increment_cart_add',{p_product_id:id})}catch(e){}}}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);saveLocal();renderProducts();toast(fav.has(id)?'Добавлено в избранное':'Удалено из избранного')}
function cartLines(){return Object.entries(cart).map(([id,qty])=>({p:products.find(x=>x.id===id),qty:+qty})).filter(x=>x.p)}
function openCart(){setNav('n-cart');const lines=cartLines();panel(`<button class="back" onclick="goHome()">← Назад</button><div class="section"><h2>🛒 Корзина</h2>${lines.length?lines.map(({p,qty})=>`<div class="cartline"><div class="thumb">${mainImage(p)?`<img src="${mainImage(p)}">`:'📦'}</div><div style="flex:1"><b>${esc(p.name)}</b><div>${money(p.price)}</div><div class="qty"><button onclick="changeQty('${p.id}',-1);openCart()">−</button><span>${qty}</span><button onclick="changeQty('${p.id}',1);openCart()">+</button></div></div><b>${money(p.price*qty)}</b></div>`).join(''):`<div class="muted" style="text-align:center;padding:30px">Корзина пуста</div>`}<div class="row"><b>Итого</b><span class="total">${money(lines.reduce((s,x)=>s+x.p.price*x.qty,0))}</span></div>${lines.length?`<button class="btn primary" style="width:100%" onclick="checkout()">${tr('checkout')}</button>`:''}</div>`)}
function changeQty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];saveLocal()}
function checkout(){if(!profile?.name){openDataPage('checkout');return}const lines=cartLines();if(!lines.length)return;const total=lines.reduce((s,x)=>s+x.p.price*x.qty,0);const tomorrow=new Date(Date.now()+86400000).toISOString().slice(0,10);panel(`<div class="ok"><div class="big">✅</div><h2>Ваш заказ оформлен!</h2><p>Номер заказа будет сохранён в вашем профиле.</p><p><b>Сумма:</b> ${money(total)}</p><p><b>Дата доставки:</b> ${tomorrow}</p><button class="btn primary" onclick="finishOrder(${total},'${tomorrow}')">Готово</button></div>`)}
async function finishOrder(total,delivery_date){let order=null;if(supabase){const r=await supabase.from('orders').insert({user_id:null,customer_id:customerId,telegram_id:tg?.initDataUnsafe?.user?.id||null,customer_name:profile.name,total,status:'pending',delivery_date}).select().single();if(!r.error)order=r.data}if(!order){order={order_number:'ORD-'+Date.now().toString().slice(-8),total,status:'pending',delivery_date,created_at:new Date().toISOString()}}for(const {p,qty} of cartLines()){if(supabase){await supabase.from('order_items').insert({order_id:order.id,product_id:p.id,product_name:p.name,price:p.price,quantity:qty});await supabase.rpc('increment_product_purchase',{p_product_id:p.id,p_quantity:qty})}}cart={};saveLocal();try{tg?.sendData(JSON.stringify({type:'order',order}))}catch(e){};openOrders()}
async function openOrders(){setNav('n-profile');let orders=[];if(supabase){const r=await supabase.from('orders').select('*,items:order_items(*)').eq('customer_id',customerId).order('created_at',{ascending:false});if(!r.error)orders=r.data||[]}panel(`<button class="back" onclick="openProfile()">← Назад</button><div class="section"><h2>🧾 ${tr('orders')}</h2>${orders.length?orders.map(o=>`<div class="section" style="margin:8px 0"><b>${esc(o.order_number||o.id)}</b><div>${money(o.total)}</div><div class="badge">${esc(o.status)}</div><div class="muted">Доставка: ${esc(o.delivery_date||'—')}</div></div>`).join(''):'<div class="muted">Заказов пока нет.</div>'}</div>`)}
function openProfile(){setNav('n-profile');panel(`<button class="back" onclick="goHome()">← Назад</button><div class="section"><h2>👤 Профиль</h2><button class="btn secondary" style="width:100%;margin:5px 0" onclick="openOrders()">🧾 ${tr('orders')}</button><button class="btn secondary" style="width:100%;margin:5px 0" onclick="openDataPage()">🪪 ${tr('data')}</button><button class="btn secondary" style="width:100%;margin:5px 0" onclick="openFavorites()">❤️ Избранное</button><h3 style="margin-top:18px">${tr('lang')}</h3><div class="chips">${[['ru','Русский'],['kaa','Qaraqalpaqsha'],['uz','O‘zbekcha']].map(([k,n])=>`<button class="chip ${lang===k?'active':''}" onclick="lang='${k}';localStorage.setItem('mg_lang',lang);openProfile();renderChips();renderProducts()">${n}</button>`).join('')}</div></div>`)}
function openDataPage(after){panel(`<button class="back" onclick="openProfile()">← Назад</button><div class="section"><h2>🪪 ${tr('data')}</h2><div class="row"><span>ID</span><b>${customerId}</b></div><div class="field" id="nameField"><label>${tr('name')} *</label><input id="name" value="${esc(profile?.name||'')}"><div class="error">Извините, это поле обязательно.</div></div><div class="field"><label>${tr('gender')}</label><select id="gender"><option value="">—</option><option value="male" ${profile?.gender==='male'?'selected':''}>${tr('male')}</option><option value="female" ${profile?.gender==='female'?'selected':''}>${tr('female')}</option><option value="other" ${profile?.gender==='other'?'selected':''}>${tr('other')}</option></select></div><div class="field"><label>${tr('about')}</label><textarea id="about" rows="4">${esc(profile?.about||'')}</textarea></div><button class="btn primary" style="width:100%" onclick="saveProfile('${after||''}')">${tr('save')}</button></div>`)}
async function saveProfile(after){const n=document.getElementById('name').value.trim();const f=document.getElementById('nameField');if(!n){f.classList.add('invalid');return}profile={name:n,gender:document.getElementById('gender').value,about:document.getElementById('about').value,customer_id:customerId};saveLocal();updateHello();if(supabase){await supabase.from('users').upsert({customer_id:customerId,telegram_id:tg?.initDataUnsafe?.user?.id||null,name:n,gender:profile.gender||null,about:profile.about,language:lang},{onConflict:'customer_id'})}after==='checkout'?checkout():openProfile()}
function openFavorites(){const arr=products.filter(p=>fav.has(p.id));panel(`<button class="back" onclick="openProfile()">← Назад</button><div class="section"><h2>❤️ Избранное</h2>${arr.length?arr.map(p=>`<div class="row"><b>${esc(p.name)}</b><button class="btn primary" onclick="addToCart('${p.id}')">🛒</button></div>`).join(''):'<div class="muted">Пока ничего нет.</div>'}</div>`)}
function openNasiya(){
  setNav('n-nasiya');
  const lim=profile?.limit||10000;
  const amounts=Array.from({length:100},(_,i)=>(i+1)*1000);
  panel(`<button class="back" onclick="goHome()">← Назад</button>
  <div class="section">
    <h2>💳 Насия</h2>
    <p class="nasiya-help">Выберите, пожалуйста, сумму рассрочки.</p>
    <div class="limits">${amounts.map(x=>`<button type="button" class="limit ${lim===x?'sel':''}" onclick="nasiyaLimitTap(${x})">${money(x)}</button>`).join('')}</div>
    <div class="field"><label>Выбранная сумма</label><input id="nAmount" type="number" value="${lim}" min="1000" max="100000" step="1000"></div>
    <button type="button" class="btn primary" style="width:100%" onclick="applyNasiya()">Оформить рассрочку</button>
  </div>`)
}
async function applyNasiya(){
  const amount=Number(document.getElementById('nAmount').value||0);
  const lim=profile?.limit||10000;
  if(!Number.isInteger(amount)||amount<1000||amount>100000||amount%1000!==0)return toast('Выберите сумму от 1 000 до 100 000 сум');
  if(amount>lim)return toast('Сначала выберите этот лимит выше');
  if(!profile?.name)return openDataPage('nasiya');
  if(supabase){
    const r=await supabase.from('nasiya_applications').insert({
      customer_id:customerId,
      telegram_id:tg?.initDataUnsafe?.user?.id||null,
      customer_name:profile?.name||'',
      amount,
      term_months:1,
      status:'pending',
      monthly_payment:amount
    });
    if(r.error)return toast('Не удалось отправить заявку');
  }
  try{tg?.sendData(JSON.stringify({type:'nasiya_application',customer_id:customerId,customer_name:profile.name,amount,status:'pending'}))}catch(e){}
  toast('Заявка «Насия» отправлена');
  openNasiya()
}

let sellerModeTaps=0,sellerModeTimer=null,adminTab='dashboard',selectedAdminFiles=[],adminCategories=[];
function nasiyaLimitTap(x){
  profile={...(profile||{}),limit:x}; saveLocal();
  if(x===10000){sellerModeTaps++; clearTimeout(sellerModeTimer); sellerModeTimer=setTimeout(()=>sellerModeTaps=0,3500); if(sellerModeTaps>=10){sellerModeTaps=0;openAdmin();return}}
  else sellerModeTaps=0;
  openNasiya();
}
function openAdmin(){document.getElementById('adminView').classList.add('show');renderAdmin('dashboard')}
function closeAdmin(){document.getElementById('adminView').classList.remove('show')}
async function adminFetch(){
  if(!supabase)return {products:[],orders:[],users:[],nasiya:[],categories:[],errors:[{message:'Supabase не подключён. Проверьте config.js.'}]};
  try{
    const [p,o,u,n,c]=await Promise.all([
      supabase.from('products').select('*,category:categories(name),images:product_images(*)').order('created_at',{ascending:false}),
      supabase.from('orders').select('*,items:order_items(*)').order('created_at',{ascending:false}),
      supabase.from('users').select('*').order('created_at',{ascending:false}),
      supabase.from('nasiya_applications').select('*').order('created_at',{ascending:false}),
      supabase.from('categories').select('*').order('sort_order')
    ]);
    return {products:p.data||[],orders:o.data||[],users:u.data||[],nasiya:n.data||[],categories:c.data||[],errors:[p.error,o.error,u.error,n.error,c.error].filter(Boolean)};
  }catch(e){return {products:[],orders:[],users:[],nasiya:[],categories:[],errors:[e]}}
}
function adminNewProduct(){selectedAdminFiles=[];adminCategories=adminCategories||[];document.getElementById('adminContent').innerHTML=adminFormHtml(null,adminCategories);bindAdminFiles()}
async function adminEditProduct(id){const d=await adminFetch();if(d.errors.length)return showAdminError(d.errors[0]);adminCategories=d.categories||[];const p=d.products.find(x=>x.id===id);if(!p)return showAdminError({message:'Товар не найден'});selectedAdminFiles=[];document.getElementById('adminContent').innerHTML=adminFormHtml(p,adminCategories);bindAdminFiles()}
function bindAdminFiles(){const el=document.getElementById('admFiles');if(!el)return;el.onchange=e=>{selectedAdminFiles=[...(e.target.files||[])];document.getElementById('admPreview').innerHTML=selectedAdminFiles.map(f=>`<img src="${URL.createObjectURL(f)}">`).join('')}}
function showAdminError(e){document.getElementById('adminContent').innerHTML=`<div class="admincard"><b>Ошибка</b><p class="admin-small">${esc(e?.message||'Неизвестная ошибка')}</p><button class="btn secondary" onclick="renderAdmin('dashboard')">Назад</button></div>`}
async function renderAdmin(tab){
  adminTab=tab; const root=document.getElementById('adminContent'); root.innerHTML='<div class="admincard">⏳ Загружаю данные…</div>';
  const d=await adminFetch(); if(d.errors.length){showAdminError(d.errors[0]);return} adminCategories=d.categories||[];
  let body='';
  if(tab==='dashboard'){
    const views=d.products.reduce((a,x)=>a+Number(x.views||0),0),adds=d.products.reduce((a,x)=>a+Number(x.cart_adds||0),0),buys=d.products.reduce((a,x)=>a+Number(x.purchases||0),0);
    body=`<div class="adm-grid"><div class="adm-tile">📦<b>${d.products.length}</b><span class="admin-small">Товаров</span></div><div class="adm-tile">🧾<b>${d.orders.length}</b><span class="admin-small">Заказов</span></div><div class="adm-tile">👥<b>${d.users.length}</b><span class="admin-small">Покупателей</span></div><div class="adm-tile">💳<b>${d.nasiya.filter(x=>x.status==='pending').length}</b><span class="admin-small">Новых Насия</span></div></div><div class="admincard"><h2>📊 Статистика</h2><div class="row"><span>Просмотры</span><b>${views}</b></div><div class="row"><span>Добавления в корзину</span><b>${adds}</b></div><div class="row"><span>Покупки</span><b>${buys}</b></div></div><div class="admincard"><button class="btn primary" onclick="adminNewProduct()">＋ Добавить товар</button></div>`;
  } else if(tab==='products') body=adminProductsHtml(d); else if(tab==='orders') body=adminOrdersHtml(d); else if(tab==='users') body=adminUsersHtml(d); else body=adminNasiyaHtml(d);
  root.innerHTML=`<div class="adminbar"><button class="admin-close" onclick="closeAdmin()">← В магазин</button><b>🛠️ Админ-панель</b></div><div class="adminnav"><button class="${tab==='dashboard'?'active':''}" onclick="renderAdmin('dashboard')">Главная</button><button class="${tab==='products'?'active':''}" onclick="renderAdmin('products')">Товары</button><button class="${tab==='orders'?'active':''}" onclick="renderAdmin('orders')">Заказы</button><button class="${tab==='users'?'active':''}" onclick="renderAdmin('users')">Покупатели</button><button class="${tab==='nasiya'?'active':''}" onclick="renderAdmin('nasiya')">Насия</button></div>${body}`;
}
function adminProductsHtml(d){return `<div class="admincard"><div class="row"><h2 style="margin:0">📦 Товары</h2><button class="btn primary" onclick="adminNewProduct()">＋ Добавить</button></div></div>${d.products.length?d.products.map(p=>{const im=(p.images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0];return `<div class="admincard"><div class="adm-row"><div class="adm-thumb">${im?.public_url?`<img src="${esc(im.public_url)}">`:'📦'}</div><div style="flex:1"><b>${esc(p.name)}</b><div>${money(p.price)}</div><div class="admin-small">Остаток: ${p.stock_qty} · ${p.is_active?'В продаже':'Скрыт'}</div><div class="admin-small">👁 ${p.views||0} · 🛒 ${p.cart_adds||0} · 🛍️ ${p.purchases||0}</div></div></div><div class="adm-actions"><button class="btn secondary" onclick="adminEditProduct('${esc(p.id)}')">Изменить</button><button class="btn danger" onclick="adminDeleteProduct('${esc(p.id)}')">Скрыть товар</button></div></div>`}).join(''):'<div class="admincard muted">Товаров пока нет.</div>'}`}
function adminOrdersHtml(d){return `<div class="admincard"><h2>🧾 Заказы</h2>${d.orders.length?d.orders.map(o=>`<div class="admincard"><div class="row"><b>${esc(o.order_number||o.id)}</b><b>${money(o.total)}</b></div><div>${esc(o.customer_name||'Покупатель')} · ${esc(o.customer_id||'—')}</div><div class="admin-small">Доставка: ${esc(o.delivery_date||'—')}</div><div class="field"><label>Статус</label><select onchange="adminSetOrderStatus('${esc(o.id)}',this.value)">${['pending','confirmed','packing','shipped','delivered','cancelled','returned'].map(x=>`<option value="${x}" ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`).join(''):'<div class="muted">Заказов пока нет.</div>'}</div>`}
function adminUsersHtml(d){return `<div class="admincard"><h2>👥 Покупатели</h2>${d.users.length?d.users.map(u=>`<div class="adm-row"><div style="flex:1"><b>${esc(u.name||'Без имени')}</b><div class="admin-small">${esc(u.customer_id||'—')} · Telegram: ${esc(u.telegram_id||'—')}</div><div class="admin-small">Язык: ${esc(u.language||'ru')} · Пол: ${esc(u.gender||'—')}</div></div></div>`).join(''):'<div class="muted">Покупателей пока нет.</div>'}</div>`}
function adminNasiyaHtml(d){return `<div class="admincard"><h2>💳 Насия</h2>${d.nasiya.length?d.nasiya.map(n=>`<div class="admincard"><b>${esc(n.customer_name||'Покупатель')}</b><div>${money(n.amount)} · ${n.term_months} мес.</div><div class="admin-small">${esc(n.customer_id||'—')}</div><div class="field"><label>Статус</label><select onchange="adminSetNasiya('${esc(n.id)}',this.value)">${['pending','approved','rejected','active','completed','overdue','cancelled'].map(x=>`<option value="${x}" ${n.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`).join(''):'<div class="muted">Заявок пока нет.</div>'}</div>`}
function adminFormHtml(p,cats){return `<div class="admincard"><h2>${p?.id?'✏️ Изменить товар':'➕ Добавить товар'}</h2><div class="field"><label>Название *</label><input id="admName" value="${esc(p?.name||'')}"></div><div class="field"><label>Цена, сум *</label><input id="admPrice" type="number" value="${p?.price||0}"></div><div class="field"><label>Старая цена</label><input id="admOld" type="number" value="${p?.old_price??''}"></div><div class="field"><label>Количество на складе</label><input id="admStock" type="number" min="0" value="${p?.stock_qty||0}"></div><div class="field"><label>Категория</label><select id="admCat"><option value="">Без категории</option>${(cats||[]).map(c=>`<option value="${esc(c.id)}" ${p?.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>В продаже</label><select id="admActive"><option value="true" ${p?.is_active!==false?'selected':''}>Да</option><option value="false" ${p?.is_active===false?'selected':''}>Нет</option></select></div><div class="field"><label>Описание</label><textarea id="admDesc" rows="5">${esc(p?.description||'')}</textarea></div><div class="field"><label>Характеристики (JSON)</label><textarea id="admSpecs" rows="6">${esc(JSON.stringify(p?.specs||{},null,2))}</textarea></div><div class="field"><label>Фотографии — можно выбрать несколько</label><input id="admFiles" type="file" accept="image/*" multiple><div id="admPreview" class="adm-photos"></div></div><button class="btn primary" onclick="adminSaveProduct('${esc(p?.id||'')}')">💾 Сохранить</button> <button class="btn secondary" onclick="renderAdmin('products')">Отмена</button></div>`}
async function adminSaveProduct(id){
  if(!supabase)return toast('Supabase не подключён');
  const name=document.getElementById('admName').value.trim(); if(!name)return toast('Введите название товара');
  let specs={}; try{specs=JSON.parse(document.getElementById('admSpecs').value||'{}')}catch(e){return toast('Характеристики должны быть JSON')}
  const body={name,price:Number(document.getElementById('admPrice').value)||0,old_price:document.getElementById('admOld').value?Number(document.getElementById('admOld').value):null,stock_qty:Number(document.getElementById('admStock').value)||0,category_id:document.getElementById('admCat').value||null,is_active:document.getElementById('admActive').value==='true',description:document.getElementById('admDesc').value,specs};
  const r=id?await supabase.from('products').update(body).eq('id',id).select().single():await supabase.from('products').insert(body).select().single();
  if(r.error)return toast(r.error.message); const pid=r.data.id;
  for(let i=0;i<selectedAdminFiles.length;i++){const f=selectedAdminFiles[i],path=`${pid}/${Date.now()}_${i}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await supabase.storage.from(cfg.STORAGE_BUCKET||'product-images').upload(path,f);if(up.error){toast('Не удалось загрузить фото');continue}const pub=supabase.storage.from(cfg.STORAGE_BUCKET||'product-images').getPublicUrl(path).data.publicUrl;const ir=await supabase.from('product_images').insert({product_id:pid,storage_path:path,public_url:pub,sort_order:i,is_main:i===0});if(ir.error)toast(ir.error.message)}
  toast('Товар сохранён'); load(); renderAdmin('products');
}
async function adminDeleteProduct(id){if(!supabase)return toast('Supabase не подключён');if(!confirm('Скрыть товар?'))return;const r=await supabase.from('products').update({is_active:false}).eq('id',id);if(r.error)toast(r.error.message);else {toast('Товар скрыт');load();renderAdmin('products')}}
async function adminSetOrderStatus(id,status){if(!supabase)return toast('Supabase не подключён');const r=await supabase.from('orders').update({status}).eq('id',id);if(r.error)toast(r.error.message);else toast('Статус заказа изменён')}
async function adminSetNasiya(id,status){if(!supabase)return toast('Supabase не подключён');const r=await supabase.from('nasiya_applications').update({status}).eq('id',id);if(r.error)toast(r.error.message);else toast('Статус Насия изменён')}

// Compatibility: make every action available to touch/inline handlers on GitHub Pages and Telegram WebView.
Object.assign(window,{goHome,openCart,openNasiya,openProfile,openProduct,addToCart,toggleFav,changeQty,checkout,finishOrder,openOrders,openDataPage,saveProfile,openFavorites,applyNasiya,nasiyaLimitTap,openAdmin,closeAdmin,renderAdmin,adminNewProduct,adminEditProduct,adminSaveProduct,adminDeleteProduct,adminSetOrderStatus,adminSetNasiya});
// A second event path for the four fixed navigation buttons. This keeps navigation working even in strict WebViews.
document.addEventListener('click',function(e){const b=e.target.closest?.('.nav');if(!b||b.getAttribute('onclick'))return;const id=b.id;if(id==='n-home')goHome();else if(id==='n-cart')openCart();else if(id==='n-nasiya')openNasiya();else if(id==='n-profile')openProfile();},{passive:true});
async function start(){await load();updateHello()} start();
</script></body></html>
